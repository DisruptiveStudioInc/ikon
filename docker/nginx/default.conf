server {
	index index.php index.html index.htm;
	server_name ikontokenize.com  *.ikontokenize.com;

        listen 80;
        charset utf-8;

	root /var/www/html/wordpress;

	gzip on;
	gzip_comp_level 6;
	gzip_types application/javascript application/rss+xml application/vnd.ms-fontobject application/x-font application/x-font-opentype application/x-font-otf application/x-font-truetype application/x-font-ttf application/x-javascript application/xhtml+xml application/xml font/opentype font/otf font/ttf image/svg+xml image/x-icon text/css text/javascript text/plain text/xml;

	error_page 404 =404 /custom_404.html;
        location = /custom_404.html {
                root /var/www/html/wordpress/404.php;
                internal;
        }



	# nginx gzip_static does not add Vary header for fonts. 
	location ~* \.(?:eot|ttf|svg)$ {
		expires max;
		add_header Vary Accept-Encoding;
		add_header Cache-Control public;
		access_log off;
	}

	location ~ /\.git {
		deny all;
	}

	location ~ /\.gitignore {
		deny all;
	}

	location ~ /\.gitmodules {
		deny all;
	}

	location ~ \.(asf|asx|wax|wmv|wmx|avi|bmp|class|divx|doc|docx|exe|gif|gz|gzip|ico|jpg|jpeg|jpe|webp|json|mdb|mid|midi|mov|qt|mp3|m4a|mp4|m4v|mpeg|mpg|mpe|webm|mpp|_otf|odb|odc|odf|odg|odp|ods|odt|ogg|pdf|png|pot|pps|ppt|pptx|ra|ram|svg|svgz|swf|tar|tif|tiff|_ttf|wav|wma|wri|xla|xls|xlsx|xlt|xlw|zip)$ {
		expires max;
		add_header Cache-Control public;
                log_not_found off;
        }

        location ~* \.(eot|ttf|woff)$ {
		expires max;
                add_header Access-Control-Allow-Origin *;
        }

	location = /favicon.ico { log_not_found off; access_log off; }
	location = /robots.txt { log_not_found off; access_log off; allow all; }
	location ~* \.(css|gif|ico|jpeg|jpg|js|png|woff2|svg)$ {
		expires max;
		log_not_found off;
	}

	# Deny access to any files with a .php extension in the uploads directory for the single site
	location ~ ^/wp-content/uploads/.*\.php$ {
		deny all;
	}


	# Deny access to any files with a .php extension in the uploads directory
	# Works in sub-directory installs and also in multisite network
	# Keep logging the requests to parse later (or to pass to firewall utilities such as fail2ban)
	location ~* /(?:uploads|files)/.*\.php$ {
		deny all;
	}

	location ~/xmlrpc.php
	{
		deny all;
	}

	location ~/.git/*
	{
		deny all;
	}


	location / {
		index index.php;
		try_files	    $uri $uri/ /index.php?$query_string&q=$uri$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_pass ikonwordpressphp:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                fastcgi_buffers 8 16k;
                fastcgi_buffer_size 32k;
                fastcgi_connect_timeout 90;
                fastcgi_send_timeout 90;
                fastcgi_read_timeout 300;
	}

	location ~ /\.ht {
		deny all;
	}

	location /author-sitemap.xml
	{
		try_files 404 =404;
	}

	location ~"/author/([0-9a-zA-Z]*)"
	{
		 rewrite ^/$ https://ikon.localhost/404 permanent;
	}

	#stop enumeration
	if ($args ~ "^/?author=([0-9]*)")
	{
           set $rule_0 1$rule_0;
	}

	if ($rule_0 = "1")
	{
          rewrite ^/$ https://ikon.localhost/404 permanent;
	}

	error_log /var/log/nginx/error_ikon.localhost.log;
	access_log /var/log/nginx/access_ikon.localhost.log;


	client_max_body_size 1024M;

}
