services:
  ikonwordpressphp:
    build:
      context: ./docker/php
    ports:
      - 9000:9000
    volumes:
      - ./:/var/www/html
    environment:
      MYSQL_HOST: 'host.docker.internal'  # O la IP real si es Linux puro
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: 'root'
      MYSQL_DATABASE: 'ikondatabase'
    #depends_on:
    #  - woocommercedb
    #links:
    #  - woocommercedb

  nginx:
    image: nginx:1.17
    ports:
      - 8011:80
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - woocommercephp

